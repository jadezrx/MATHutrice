name: Architecture Check

on:
  push:
  pull_request:

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run tach check
      - run: uv run python scripts/check_cycles.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  # Deploy on green: a push to the default branch, once `architecture` and
  # `test` have both passed on that same commit, is built into one image,
  # tagged with the commit, and deployed to Fork staging. A pull request, a
  # push to another branch, or a red run never reaches this job.
  deploy-staging:
    name: deploy to staging
    needs: [architecture, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/course-2026-fallback-clean-bench'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One deploy at a time, in the order pushed.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      # One image per commit, tagged with it. A commit pushed twice is built
      # once. The label links the package to this repository on GHCR.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "REVISION=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # OpenID Connect, as the GitHub Environment: no Azure password is stored.
      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Written at every deploy, so the GitHub Environment stays the one place
      # a secret is changed. --output none: the command would otherwise print
      # every setting back, secrets included. Everything but the three secrets
      # is the same in both environments:
      # - WEBSITES_PORT: uvicorn listens on 8000, not on the 80 App Service expects.
      # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false: the SQLite file stays on the
      #   container's own disk, created and seeded again at every start.
      # - AUTH_MODE=dev: no real users; the sign-in is guarded by the
      #   environment's DEV_LOGIN_KEY, the cookie by its SESSION_SECRET.
      - name: Write staging's settings
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
            --settings \
              WEBSITES_PORT=8000 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
              AUTH_MODE=dev \
              DATABASE_URL=sqlite:///./mathutrice.db \
              LLM_BASE_URL=https://api.mistral.ai/v1 \
              LLM_MODEL=ministral-14b-latest \
              "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
              "SESSION_SECRET=$SESSION_SECRET" \
              "LLM_API_KEY=$LLM_API_KEY"

      # The image is public on GHCR, so the app pulls it without credentials.
      - name: Run the image on staging
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
            --container-image-name "$IMAGE"
          running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
          if [ "$running" != "DOCKER|$IMAGE" ]; then
            echo "$APP_NAME is set to $running, not $IMAGE" >&2
            exit 1
          fi
          echo "$APP_NAME now runs $IMAGE"

      # App Service keeps serving the previous container until the new one has
      # started, so a 200 alone may come from the old image. Wait until the
      # image just set answers with its own commit in X-Revision; a container
      # that never starts fails the job. 700 s is the Worked Example's limit:
      # twice the slowest start it measured on the same kind of shared plan.
      - name: Wait until the new image answers
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          url="https://$APP_NAME.azurewebsites.net/dev/login"
          limit=700
          start=$(date +%s)
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            answer=$(curl -s -o /dev/null -w '%{http_code} %header{x-revision}' --max-time 30 "$url" || true)
            elapsed=$(( $(date +%s) - start ))
            if [ "$answer" = "200 $GITHUB_SHA" ]; then
              echo "$url answers 200 from $GITHUB_SHA, ${elapsed} s after the image was set"
              exit 0
            fi
            echo "Attempt $attempt, ${elapsed} s: $url answered ${answer:-nothing}, waiting for 200 $GITHUB_SHA"
            if [ "$elapsed" -ge "$limit" ]; then
              echo "$url did not answer 200 from $GITHUB_SHA within $limit s" >&2
              exit 1
            fi
            sleep 15
          done
